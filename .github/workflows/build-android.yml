# Сборка Android-приложения (AAB) через EAS Build для публикации в RuStore.
# Перед использованием добавьте в секреты репозитория: EXPO_TOKEN (токен из https://expo.dev/accounts/[account]/settings/access-tokens).

name: Build Android (EAS)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - 'shared/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install shared dependencies
        run: npm ci
        working-directory: shared

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (production AAB)
        run: eas build --platform android --profile production --non-interactive
        working-directory: mobile
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
