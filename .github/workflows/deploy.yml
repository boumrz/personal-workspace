name: Deploy Application

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Позволяет запускать вручную из GitHub UI

jobs:
  # Деплой фронтенда на удаленный сервер
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          # Используем API URL из секретов, если указан, иначе относительный путь
          VITE_API_URL: ${{ secrets.API_URL || '/api' }}
          # VK ID и Telegram — для кнопок входа/привязки (см. docs/VK_ID_SETUP.md)
          VITE_VK_ID_APP_ID: ${{ secrets.VITE_VK_ID_APP_ID || '' }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME || '' }}

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend dist to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          tar -czf frontend-dist.tgz -C dist .
          scp -o StrictHostKeyChecking=no frontend-dist.tgz ${SERVER_USER}@${SERVER_HOST}:/tmp/frontend-dist.tgz
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "\
            set -e; \
            mkdir -p '${SERVER_PATH}/dist'; \
            find '${SERVER_PATH}/dist' -mindepth 1 -maxdepth 1 -exec rm -rf {} +; \
            tar -xzf /tmp/frontend-dist.tgz -C '${SERVER_PATH}/dist'; \
            rm -f /tmp/frontend-dist.tgz"
          rm -f frontend-dist.tgz

  # Деплой бэкенда на удаленный сервер
  deploy-backend:
    runs-on: ubuntu-latest
    # Запускаем параллельно с фронтендом для ускорения
    # needs: deploy-frontend  # Раскомментируйте, если хотите последовательный деплой

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create and deploy server .env
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          VK_ID_APP_ID: ${{ secrets.VK_ID_APP_ID }}
          VK_ID_APP_IDS: ${{ secrets.VK_ID_APP_IDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VITE_VK_ID_APP_ID: ${{ secrets.VITE_VK_ID_APP_ID }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GIGACHAT_CLIENT_ID: ${{ secrets.GIGACHAT_CLIENT_ID }}
          GIGACHAT_CLIENT_SECRET: ${{ secrets.GIGACHAT_CLIENT_SECRET }}
          GIGACHAT_CA_CERT_PEM: ${{ secrets.GIGACHAT_CA_CERT_PEM }}
          GIGACHAT_CA_CERT_BASE64: ${{ secrets.GIGACHAT_CA_CERT_BASE64 }}
          GIGACHAT_CA_CERT_PATH: ${{ secrets.GIGACHAT_CA_CERT_PATH }}
          GPT4FREE_BASE_URL: ${{ secrets.GPT4FREE_BASE_URL }}
          GPT4FREE_API_KEY: ${{ secrets.GPT4FREE_API_KEY }}
          GPT4FREE_MODEL: ${{ secrets.GPT4FREE_MODEL }}
          GPT4FREE_TIMEOUT_MS: ${{ secrets.GPT4FREE_TIMEOUT_MS }}
          GPT4FREE_PORT: ${{ secrets.GPT4FREE_PORT || '1337' }}
          GPT4FREE_BIND_IP: ${{ secrets.GPT4FREE_BIND_IP || '127.0.0.1' }}
        run: |
          ESCAPED_GIGACHAT_CA_CERT_PEM="${GIGACHAT_CA_CERT_PEM//$'\n'/\\n}"
          cat > .env.server << EOF
          PORT=3001
          NODE_ENV=production
          DB_HOST=${DB_HOST:-localhost}
          DB_PORT=${DB_PORT:-5432}
          DB_NAME=${DB_NAME:-finance_assistant}
          DB_USER=${DB_USER:-postgres}
          DB_PASSWORD=${DB_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          CORS_ORIGIN=${CORS_ORIGIN}
          VK_ID_APP_ID=${VK_ID_APP_ID}
          VK_ID_APP_IDS=${VK_ID_APP_IDS}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          VITE_VK_ID_APP_ID=${VITE_VK_ID_APP_ID}
          VITE_TELEGRAM_BOT_USERNAME=${VITE_TELEGRAM_BOT_USERNAME}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
          GIGACHAT_AUTH_KEY=${GIGACHAT_AUTH_KEY}
          GIGACHAT_CLIENT_ID=${GIGACHAT_CLIENT_ID}
          GIGACHAT_CLIENT_SECRET=${GIGACHAT_CLIENT_SECRET}
          GIGACHAT_CA_CERT_PEM=${ESCAPED_GIGACHAT_CA_CERT_PEM}
          GIGACHAT_CA_CERT_BASE64=${GIGACHAT_CA_CERT_BASE64}
          GIGACHAT_CA_CERT_PATH=${GIGACHAT_CA_CERT_PATH}
          GPT4FREE_BASE_URL=${GPT4FREE_BASE_URL}
          GPT4FREE_API_KEY=${GPT4FREE_API_KEY}
          GPT4FREE_MODEL=${GPT4FREE_MODEL}
          GPT4FREE_TIMEOUT_MS=${GPT4FREE_TIMEOUT_MS}
          EOF
          cat > .env.gpt4free << EOF
          GPT4FREE_PORT=${GPT4FREE_PORT}
          GPT4FREE_BIND_IP=${GPT4FREE_BIND_IP}
          EOF
          scp -o StrictHostKeyChecking=no .env.server ${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/.env
          scp -o StrictHostKeyChecking=no .env.gpt4free ${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/gpt4free-server/.env
          rm -f .env.server .env.gpt4free

      - name: Deploy to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          DEPLOY_REF: ${{ github.sha }}
          GPT4FREE_DEPLOY_ENABLED: ${{ secrets.GPT4FREE_DEPLOY_ENABLED || 'true' }}
          GPT4FREE_PORT: ${{ secrets.GPT4FREE_PORT || '1337' }}
        run: |
          # Создаем скрипт деплоя на лету (используем одинарные кавычки для heredoc, чтобы переменные подставлялись на сервере)
          cat > deploy-remote.sh << 'DEPLOYSCRIPT'
          #!/bin/bash
          set -e

          echo "🚀 Начинаем деплой на сервере..."

          # Загружаем переменные окружения для Node.js (если используется nvm)
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || true

          # Или загружаем из стандартных путей
          export PATH="$PATH:/usr/bin:/usr/local/bin:$HOME/.local/bin"

          # Проверяем доступность npm
          if ! command -v npm &> /dev/null; then
            echo "⚠️ npm не найден, пытаемся найти в стандартных местах..."
            # Попробуем найти npm
            NPM_PATH=$(which npm 2>/dev/null || find /usr -name npm 2>/dev/null | head -1 || find /usr/local -name npm 2>/dev/null | head -1)
            if [ -n "$NPM_PATH" ]; then
              export PATH="$(dirname $NPM_PATH):$PATH"
              echo "✅ npm найден: $NPM_PATH"
            else
              echo "❌ npm не установлен. Установите Node.js на сервере."
              exit 1
            fi
          fi

          echo "📋 Версия Node.js: $(node --version 2>/dev/null || echo 'не найдена')"
          echo "📋 Версия npm: $(npm --version 2>/dev/null || echo 'не найдена')"

          # Переходим в директорию проекта
          cd "${SERVER_PATH}" || exit 1

          # Обновляем код из репозитория
          echo "📥 Обновление кода из репозитория..."
          git fetch origin --prune --tags
          if [ -n "${DEPLOY_REF:-}" ]; then
            git checkout --force "${DEPLOY_REF}"
          else
            git checkout --force origin/main || git checkout --force origin/master
          fi

          # Обновляем зависимости бэкенда
          echo "📦 Установка зависимостей бэкенда..."
          cd server
          npm ci --production || npm install --production

          # Auto-start gpt4free sidecar to avoid manual docker run.
          if [ "${GPT4FREE_DEPLOY_ENABLED:-true}" = "true" ]; then
            cd ../gpt4free-server
            if command -v docker >/dev/null 2>&1; then
              if docker compose version >/dev/null 2>&1; then
                docker compose up -d
              elif command -v docker-compose >/dev/null 2>&1; then
                docker-compose up -d
              else
                echo "⚠️ docker compose not found, gpt4free was not started."
              fi
              if command -v curl >/dev/null 2>&1; then
                if curl -fsS --max-time 20 "http://127.0.0.1:${GPT4FREE_PORT:-1337}/v1/models" >/dev/null; then
                  echo "✅ gpt4free is healthy."
                else
                  echo "⚠️ gpt4free health-check failed, parser will use heuristic fallback."
                fi
              fi
            else
              echo "⚠️ Docker is not installed, gpt4free was not started."
            fi
            cd ../server
          fi

          # Запускаем миграции
          echo "🗄️  Запуск миграций базы данных..."
          npm run migrate || echo "⚠️ Миграции пропущены (возможна ошибка)"

          # Перезапускаем бэкенд через PM2
          echo "🔄 Перезапуск бэкенда..."
          pm2 restart finance-assistant-api || (pm2 delete finance-assistant-api 2>/dev/null || true; pm2 start ecosystem.config.cjs --env production)
          pm2 save

          # Backend-only deploy: не трогаем фронтенд сборку и nginx-конфиг,
          # чтобы выкладка API была независимой от web/mobile релизов.
          cd ..

          echo "✅ Деплой завершен успешно!"
          DEPLOYSCRIPT

          # Копируем и выполняем скрипт на сервере
          scp -o StrictHostKeyChecking=no deploy-remote.sh ${SERVER_USER}@${SERVER_HOST}:/tmp/deploy-remote.sh
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "chmod +x /tmp/deploy-remote.sh && SERVER_PATH='${SERVER_PATH}' DEPLOY_REF='${DEPLOY_REF}' GPT4FREE_DEPLOY_ENABLED='${GPT4FREE_DEPLOY_ENABLED}' GPT4FREE_PORT='${GPT4FREE_PORT}' bash /tmp/deploy-remote.sh && rm -f /tmp/deploy-remote.sh"

          # Очищаем временный скрипт
          rm -f deploy-remote.sh

      - name: Verify deployment
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_HEALTHCHECK_URL: ${{ secrets.SERVER_HEALTHCHECK_URL || '' }}
        run: |
          echo "🔍 Проверка статуса сервера..."
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "pm2 status || echo 'PM2 не запущен'"
          if [ -n "${SERVER_HEALTHCHECK_URL}" ]; then
            echo "🌡️ Проверка health endpoint..."
            curl -fsSL "${SERVER_HEALTHCHECK_URL}" >/dev/null
          fi

  # Проверяем, изменились ли версии мобильного приложения
  detect-mobile-version-change:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check mobile version changes
        id: check
        shell: bash
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIFF=$(git diff --unified=0 "$BEFORE_SHA" "$AFTER_SHA" -- mobile/app.json mobile/package.json || true)
          echo "$DIFF"

          if printf "%s\n" "$DIFF" | grep -E '^[+-].*"version(Code)?"[[:space:]]*:' >/dev/null; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Сборка Android AAB запускается только при изменении версии мобильного приложения
  build-android-aab:
    if: needs.detect-mobile-version-change.outputs.version_changed == 'true'
    needs: detect-mobile-version-change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build Android AAB
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_VK_ID_APP_ID: ${{ secrets.EXPO_PUBLIC_VK_ID_APP_ID }}
          EXPO_PUBLIC_VK_ID_REDIRECT_SCHEME: ${{ secrets.EXPO_PUBLIC_VK_ID_REDIRECT_SCHEME || 'financeassistant' }}
          EXPO_PUBLIC_MYTRACKER_SDK_KEY: ${{ secrets.EXPO_PUBLIC_MYTRACKER_SDK_KEY }}
          EXPO_PUBLIC_SPEECH_PARSE_PROVIDER: ${{ secrets.EXPO_PUBLIC_SPEECH_PARSE_PROVIDER || '' }}
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: npm run build:android:aab
