# Example shared reverse-proxy vhost for the server that hosts both products.
# Install this in the shared Nginx/reverse-proxy container or adapt upstream
# names to that proxy's network.
#
# Required external Docker network:
#   docker network create domiknote_proxy
#
# Finance Assistant compose stack must connect `web` to the same network.

upstream finance_assistant_web {
    server finance-assistant-web-1:80;
}

server {
    listen 80;
    server_name domiknote.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name domiknote.ru;

    ssl_certificate /etc/letsencrypt/live/domiknote.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domiknote.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    location / {
        proxy_pass http://finance_assistant_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
