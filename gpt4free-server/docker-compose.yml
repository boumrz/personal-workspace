# GPT4Free API Server для Finance Assistant
# Локально: docker-compose up -d
# На удалённой машине: см. README.md

services:
  g4f:
    image: hlohaus789/g4f:latest-slim
    container_name: finance-gpt4free
    command: python -m g4f.cli api --bind 0.0.0.0:1337
    ports:
      - "${GPT4FREE_PORT:-1337}:1337"
    restart: unless-stopped
